<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini App Daily Planner</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 id="greeting">Привет!</h1>
      <p class="sub">Ежедневник задач</p>
    </header>

    <section class="card form-card">
      <h2>Новая задача</h2>
      <form id="task-form">
        <label>
          Название
          <input id="title" type="text" maxlength="255" required placeholder="Например: Подготовить отчёт" />
        </label>
        <label>
          Описание
          <textarea id="description" maxlength="2000" rows="3" placeholder="Краткое описание"></textarea>
        </label>
        <label>
          Дедлайн
          <input id="deadline" type="datetime-local" required />
        </label>
        <button type="submit" class="btn btn-primary">Создать задачу</button>
      </form>
    </section>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="active">Активные</button>
      <button class="tab" data-tab="today">Сегодня</button>
      <button class="tab" data-tab="completed">Завершённые</button>
      <button class="tab" data-tab="leaderboard">Лидерборд</button>
    </nav>

    <section class="card" id="tasks-section">
      <h2 id="list-title">Активные задачи</h2>
      <div id="tasks-list" class="list"></div>
    </section>

    <section class="card hidden" id="leaderboard-section">
      <h2>Топ-10 пользователей</h2>
      <div id="leaderboard-list" class="list"></div>
    </section>

    <p id="status" class="status"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
